services:
  postgres:
    image: postgres:16
    container_name: enterprise-ai-mentor-postgres
    environment:
      POSTGRES_DB: enterprise_ai_mentor
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
